<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 80" width="40" height="80">
  <!-- Radio tower: lattice structure with ball on top -->
  <g fill="none" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two main legs (inverted V) -->
    <line x1="8" y1="76" x2="17" y2="14"/>
    <line x1="32" y1="76" x2="23" y2="14"/>
    <!-- Horizontal cross-members -->
    <line x1="10.5" y1="68" x2="29.5" y2="68"/>
    <line x1="12" y1="58" x2="28" y2="58"/>
    <line x1="13.5" y1="48" x2="26.5" y2="48"/>
    <line x1="15" y1="38" x2="25" y2="38"/>
    <line x1="16.5" y1="28" x2="23.5" y2="28"/>
    <!-- X-braces between horizontals -->
    <!-- Bottom section -->
    <line x1="10.5" y1="68" x2="28" y2="58"/>
    <line x1="29.5" y1="68" x2="12" y2="58"/>
    <!-- Section 2 -->
    <line x1="12" y1="58" x2="26.5" y2="48"/>
    <line x1="28" y1="58" x2="13.5" y2="48"/>
    <!-- Section 3 -->
    <line x1="13.5" y1="48" x2="25" y2="38"/>
    <line x1="26.5" y1="48" x2="15" y2="38"/>
    <!-- Section 4 -->
    <line x1="15" y1="38" x2="23.5" y2="28"/>
    <line x1="25" y1="38" x2="16.5" y2="28"/>
    <!-- Antenna mast above lattice -->
    <line x1="20" y1="28" x2="20" y2="10"/>
    <!-- Base feet -->
    <line x1="5" y1="76" x2="11" y2="76"/>
    <line x1="29" y1="76" x2="35" y2="76"/>
  </g>
  <!-- Ball on top -->
  <circle cx="20" cy="7" r="4" fill="#6b7280"/>
</svg>
