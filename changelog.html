<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReaderWrangler — Changelog</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #1e293b; line-height: 1.6; }
        header { background: #dbeafe; border-bottom: 1px solid #bfdbfe; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
        header img { width: 32px; height: 32px; }
        header h1 { font-size: 1.1em; font-weight: 600; color: #1e40af; }
        header a { color: #2563eb; text-decoration: none; font-size: 0.85em; margin-left: auto; }
        header a:hover { text-decoration: underline; }
        #content { max-width: 800px; margin: 32px auto; padding: 0 24px; }
        #content h1 { font-size: 1.8em; margin-bottom: 16px; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        #content h2 { font-size: 1.4em; margin-top: 32px; margin-bottom: 12px; color: #1e40af; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
        #content h3 { font-size: 1.15em; margin-top: 20px; margin-bottom: 8px; color: #334155; }
        #content p { margin-bottom: 12px; }
        #content ul, #content ol { margin-bottom: 12px; padding-left: 24px; }
        #content li { margin-bottom: 4px; }
        #content code { background: #e2e8f0; padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
        #content pre { background: #e2e8f0; padding: 12px; border-radius: 6px; overflow-x: auto; margin-bottom: 12px; }
        #content pre code { background: none; padding: 0; }
        #content strong { color: #0f172a; }
        #content hr { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0; }
        #loading { text-align: center; padding: 60px 0; color: #64748b; }
        #error { text-align: center; padding: 60px 0; color: #dc2626; display: none; }
    </style>
</head>
<body>
    <header>
        <img src="icons/logo-transparent-32.png" alt="ReaderWrangler">
        <h1>ReaderWrangler Changelog</h1>
        <a href="readerwrangler.html">Back to App</a>
    </header>
    <div id="content">
        <div id="loading">Loading changelog...</div>
        <div id="error">Could not load changelog. <a href="https://github.com/Ron-L/ReaderWrangler/blob/main/CHANGELOG.md">View on GitHub</a></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('CHANGELOG.md')
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(md => { document.getElementById('content').innerHTML = marked.parse(md); })
            .catch(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            });
    </script>
</body>
</html>
