<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReaderWrangler</title>

    <!-- Favicons (v4.6.0) -->
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <!-- Google Fonts - Libre Baskerville for title -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- v5.5.7 - Theme detection (runs before paint to prevent flash) -->
    <script>
        (function() {
            var stored = localStorage.getItem('readerwrangler-theme');
            var theme = stored;
            if (!stored || stored === 'auto') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (theme && theme !== 'light') {
                document.documentElement.dataset.theme = theme;
            }
        })();
    </script>
    <link rel="stylesheet" href="readerwrangler.css?v=5.5.14">
    <!-- v5.5.11 - Splash screen styles (no Tailwind dependency) -->
    <style>
        @keyframes splash-spin {
            to { transform: rotate(360deg); }
        }
        .splash-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-default, #e2e8f0);
            border-top-color: var(--bg-accent, #3b82f6);
            border-radius: 50%;
            animation: splash-spin 0.8s linear infinite;
        }
        [data-theme="dark"] #splash img,
        [data-theme="hc-dark"] #splash img {
            filter: invert(1) hue-rotate(180deg);
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- v5.5.11 - Splash screen (replaced when React mounts) -->
        <div id="splash" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:var(--bg-page, #ffffff);">
            <img src="icons/logo-transparent.png" alt="" style="width:80px; height:80px; margin-bottom:20px;">
            <div style="font-family:'Libre Baskerville',Georgia,serif; font-size:1.8em; font-weight:700; color:var(--text-primary, #1e293b); margin-bottom:8px;">ReaderWrangler&#8482;</div>
            <div style="color:var(--text-muted, #64748b); font-size:0.9em; margin-bottom:24px;">Loading...</div>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- Libraries (moved from head to allow splash to paint first) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared modules (pure JS, no Babel needed) -->
    <script src="uiHelpers.js?v=5.5.1"></script>
    <script src="storage.js?v=5.5.1"></script>

    <!-- Main app with JSX (needs Babel) - Dynamic loading for cache busting -->
    <script>
        // APP_VERSION - Single source of truth for cache busting
        // Update this on each release to force browsers to fetch new code
        const APP_VERSION = "5.5.14.1";

        // Viewport detection: load mobile.js on phone-width screens
        const forceDesktop = localStorage.getItem('readerwrangler-desktopMode') === 'true';
        const isMobile = !forceDesktop && window.matchMedia('(max-width: 767px)').matches;

        // Dynamically load the appropriate app with version-based cache busting
        const script = document.createElement('script');
        script.type = 'text/babel';
        script.src = (isMobile ? 'mobile.js' : 'readerwrangler.js') + '?v=' + APP_VERSION;
        document.body.appendChild(script);
    </script>
    <!-- Emergency reset fallback: if app fails to mount within 15s, offer reset -->
    <script>
        window._appMountTimer = setTimeout(function() {
            var splash = document.getElementById('splash');
            if (!splash) return; // React mounted and replaced splash — all good
            splash.innerHTML =
                '<div style="text-align:center; padding:40px 20px; max-width:400px;">' +
                    '<div style="font-size:2em; margin-bottom:16px;">&#9888;&#65039;</div>' +
                    '<div style="font-family:\'Libre Baskerville\',Georgia,serif; font-size:1.4em; font-weight:700; color:var(--text-primary,#1e293b); margin-bottom:12px;">Something went wrong</div>' +
                    '<div style="color:var(--text-muted,#64748b); font-size:0.95em; line-height:1.6; margin-bottom:24px;">' +
                        'ReaderWrangler failed to load. This may be caused by corrupted data. ' +
                        'You can reset the app to fix this. Your files on disk are safe.' +
                    '</div>' +
                    '<button id="emergencyResetBtn" style="padding:12px 24px; background:#dc2626; color:white; border:none; border-radius:8px; font-size:1em; font-weight:600; cursor:pointer; margin-bottom:12px;">Reset App</button>' +
                    '<div style="color:var(--text-muted,#64748b); font-size:0.8em; margin-top:8px;">Import your backup file after reset to restore everything.</div>' +
                '</div>';
            document.getElementById('emergencyResetBtn').addEventListener('click', function() {
                if (!confirm('This will clear all ReaderWrangler data from your browser.\n\nYour files on disk are safe. Import your backup file after reset to restore everything.\n\nContinue?')) return;
                var keys = ['readerwrangler-state','readerwrangler-enriched-cache','readerwrangler-settings','readerwrangler-status','readerwrangler-filters','readerwrangler-explorer','readerwrangler-folders','readerwrangler-mobile-prefs','readerwrangler-theme','readerwrangler-desktopMode'];
                keys.forEach(function(k) { localStorage.removeItem(k); });
                var req = indexedDB.deleteDatabase('ReaderWranglerDB');
                req.onsuccess = req.onerror = req.onblocked = function() { location.reload(); };
            });
        }, 15000);
    </script>
    <script data-goatcounter="https://readerwrangler.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
