<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReaderWrangler</title>

    <!-- Favicons (v4.6.0) -->
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dbeafe">
    <!-- Apple PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ReaderWrangler">
    <!-- Google Fonts - Libre Baskerville for title -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- v5.5.7 - Theme detection (runs before paint to prevent flash) -->
    <script>
        (function() {
            var stored = localStorage.getItem('readerwrangler-theme');
            var theme = stored;
            if (!stored || stored === 'auto') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (theme && theme !== 'light') {
                document.documentElement.dataset.theme = theme;
            }
        })();
    </script>
    <link rel="stylesheet" href="readerwrangler.css?v=6.10.0">
    <!-- v5.5.11 - Splash screen styles (no Tailwind dependency) -->
    <style>
        @keyframes splash-spin {
            to { transform: rotate(360deg); }
        }
        .splash-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-default, #e2e8f0);
            border-top-color: var(--bg-accent, #3b82f6);
            border-radius: 50%;
            animation: splash-spin 0.8s linear infinite;
        }
        /* v6.3.0 - CSS-only rotating messages (runs on compositor, immune to JS blocking) */
        .splash-msgs {
            position: relative;
            width: 400px;
            max-width: 90vw;
            height: 1.4em;
            margin-bottom: 24px;
        }
        .splash-msgs span {
            position: absolute;
            left: 0; right: 0;
            text-align: center;
            opacity: 0;
            animation: splash-fade 24s infinite;
        }
        @keyframes splash-fade {
            0%, 1% { opacity: 0; }
            2%, 10.5% { opacity: 1; }
            12.5%, 100% { opacity: 0; }
        }
        /* animation-delay set inline by shuffle script */
        [data-theme="dark"] #splash img,
        [data-theme="hc-dark"] #splash img {
            filter: invert(1) hue-rotate(180deg);
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- v5.5.11 - Splash screen (replaced when React mounts) -->
        <div id="splash" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:var(--bg-page, #ffffff);">
            <img src="icons/logo-transparent.png" alt="" style="width:80px; height:80px; margin-bottom:20px;">
            <div style="font-family:'Libre Baskerville',Georgia,serif; font-size:1.8em; font-weight:700; color:var(--text-primary, #1e293b); margin-bottom:8px;">ReaderWrangler&#8482;</div>
            <!-- v6.3.0 - CSS-animated rotating messages, randomly selected each visit -->
            <div id="splashMsgs" class="splash-msgs" style="color:var(--text-muted, #64748b); font-size:0.9em;"></div>
            <script>
                (function() {
                    var blurbs = [
                        "Wrangling your library...", "Your books, your order.", "Wrangle order from chaos.",
                        "Unbury your next great read.", "Organizing the chaos into a system.",
                        "See all your books in one place.", "Folders, tags, and total control.",
                        "Your reading life, organized.", "From chaos to control.",
                        "The organizer Amazon forgot to build.", "Every book accounted for.",
                        "Rediscover forgotten treasures.", "Never lose track of what to read next.",
                        "Take command of your reading life.", "A file manager for your reading list."
                    ];
                    var banter = [
                        "Shelving your books...", "Taming the chaos...", "Organizing the stacks...",
                        "Dusting the shelves...", "Alphabetizing the spines...", "Sorting by series order...",
                        "Herding stray paperbacks...", "Untangling your reading list...",
                        "Rescuing buried favorites...", "Shushing the noisy ones...",
                        "Checking books in...", "Cataloging the collection...",
                        "Straightening the bookends...", "Pressing the dog-ears flat...",
                        "Evicting the bookworms...", "Waking the librarian...",
                        "Brewing a reading-sized coffee...", "Finding your bookmark..."
                    ];
                    function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.random() * (i + 1) | 0; var t = a[i]; a[i] = a[j]; a[j] = t; } }
                    shuffle(blurbs); shuffle(banter);
                    var el = document.getElementById('splashMsgs');
                    for (var i = 0; i < 8; i++) {
                        var s = document.createElement('span');
                        s.textContent = i % 2 === 0 ? blurbs[i >> 1] : banter[i >> 1];
                        s.style.animationDelay = (i * 3) + 's';
                        el.appendChild(s);
                    }
                })();
            </script>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- Libraries (moved from head to allow splash to paint first) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Shared modules (pure JS, no Babel needed) -->
    <script src="uiHelpers.js?v=5.5.1"></script>
    <script src="storage.js?v=5.5.1"></script>
    <!-- v6.3.0 - Data integrity checks -->
    <script src="integrity.js?v=6.3.0-alpha.6"></script>
    <!-- v6.0.0 - Relay modules (encrypt, compress, client) -->
    <script src="relay-crypto.js?v=6.0.0"></script>
    <script src="relay-compress.js?v=6.0.0"></script>
    <script src="relay-client.js?v=6.9.0"></script>
    <!-- v6.0.0 - QR code generation for mobile pairing (desktop only, ~4KB) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Main app with JSX (needs Babel) - Dynamic loading for cache busting -->
    <script>
        // APP_VERSION - Single source of truth for cache busting
        // Update this on each release to force browsers to fetch new code
        const APP_VERSION = "6.11.1";

        // Viewport detection: load mobile.js on phone-width screens
        // Session guard: once desktop loads in a tab, it stays desktop for that session
        // (prevents accidental mobile switch on browser resize + reload)
        const forceDesktop = localStorage.getItem('readerwrangler-desktopMode') === 'true';
        const sessionMode = sessionStorage.getItem('readerwrangler-sessionMode');
        const isMobileViewport = window.matchMedia('(max-width: 767px)').matches;

        // Interstitial: mobile viewport + desktopMode flag → ask user before loading
        if (forceDesktop && isMobileViewport && sessionMode !== 'desktop') {
            var splash = document.getElementById('splash');
            if (splash) {
                splash.innerHTML =
                    '<div style="text-align:center; padding:40px 20px; max-width:360px;">' +
                        '<img src="icons/logo-transparent.png" alt="" style="width:64px; height:64px; margin-bottom:16px;">' +
                        '<div style="font-family:\'Libre Baskerville\',Georgia,serif; font-size:1.5em; font-weight:700; color:var(--text-primary,#1e293b); margin-bottom:24px;">ReaderWrangler\u2122</div>' +
                        '<div style="color:var(--text-secondary,#475569); font-size:0.95em; line-height:1.6; margin-bottom:28px;">' +
                            'You previously switched to desktop mode on this device.' +
                        '</div>' +
                        '<button id="revertMobileBtn" style="display:block; width:100%; padding:14px; margin-bottom:12px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border:none; border-radius:12px; font-size:1.05em; font-weight:600; cursor:pointer;">Return to Mobile Mode</button>' +
                        '<button id="continueDesktopBtn" style="display:block; width:100%; padding:14px; background:var(--bg-muted,#f1f5f9); color:var(--text-primary,#1e293b); border:1px solid var(--border-default,#e2e8f0); border-radius:12px; font-size:1em; cursor:pointer;">Continue in Desktop Mode</button>' +
                    '</div>';
                document.getElementById('revertMobileBtn').addEventListener('click', function() {
                    localStorage.removeItem('readerwrangler-desktopMode');
                    sessionStorage.removeItem('readerwrangler-sessionMode');
                    location.reload();
                });
                document.getElementById('continueDesktopBtn').addEventListener('click', function() {
                    sessionStorage.setItem('readerwrangler-sessionMode', 'desktop');
                    location.reload();
                });
            }
        } else {
            // Normal flow: determine mode and load app
            // Priority: forceDesktop flag > session lock > viewport detection
            var isMobile = !forceDesktop && (sessionMode === 'mobile' || (sessionMode !== 'desktop' && isMobileViewport));

            // Lock mode for this session (prevents resize+reload from switching)
            sessionStorage.setItem('readerwrangler-sessionMode', isMobile ? 'mobile' : 'desktop');

            // Dynamically load the appropriate app with version-based cache busting
            window._appLoading = true; // Signal to emergency reset timer
            window._appTimeout = isMobile ? 45000 : 15000; // Mobile Babel compile is slow on phones
            var script = document.createElement('script');
            script.type = 'text/babel';
            script.src = (isMobile ? 'mobile.js' : 'readerwrangler.js') + '?v=' + APP_VERSION;
            document.body.appendChild(script);
        }
    </script>
    <!-- Emergency reset fallback: offer reset if app fails to mount -->
    <!-- Skip timer if interstitial shown (no app code loaded) -->
    <script>
        if (window._appLoading) window._appMountTimer = setTimeout(function() {
            var splash = document.getElementById('splash');
            if (!splash) return; // React mounted and replaced splash — all good
            splash.innerHTML =
                '<div style="text-align:center; padding:40px 20px; max-width:400px;">' +
                    '<div style="font-size:2em; margin-bottom:16px;">&#9888;&#65039;</div>' +
                    '<div style="font-family:\'Libre Baskerville\',Georgia,serif; font-size:1.4em; font-weight:700; color:var(--text-primary,#1e293b); margin-bottom:12px;">Something went wrong</div>' +
                    '<div style="color:var(--text-muted,#64748b); font-size:0.95em; line-height:1.6; margin-bottom:24px;">' +
                        'ReaderWrangler failed to load. This may be caused by corrupted data. ' +
                        'You can reset the app to fix this. Your files on disk are safe.' +
                    '</div>' +
                    '<button id="emergencyResetBtn" style="padding:12px 24px; background:#dc2626; color:white; border:none; border-radius:8px; font-size:1em; font-weight:600; cursor:pointer; margin-bottom:12px;">Reset App</button>' +
                    '<div style="color:var(--text-muted,#64748b); font-size:0.8em; margin-top:8px;">Import your backup file after reset to restore everything.</div>' +
                '</div>';
            document.getElementById('emergencyResetBtn').addEventListener('click', function() {
                if (!confirm('This will clear all ReaderWrangler data from your browser.\n\nYour files on disk are safe. Import your backup file after reset to restore everything.\n\nContinue?')) return;
                var keys = ['readerwrangler-state','readerwrangler-enriched-cache','readerwrangler-settings','readerwrangler-status','readerwrangler-filters','readerwrangler-explorer','readerwrangler-folders','readerwrangler-mobile-prefs','readerwrangler-theme','readerwrangler-desktopMode'];
                keys.forEach(function(k) { localStorage.removeItem(k); });
                var req = indexedDB.deleteDatabase('ReaderWranglerDB');
                req.onsuccess = req.onerror = req.onblocked = function() { location.reload(); };
            });
        }, window._appTimeout || 15000);
    </script>
    <script data-goatcounter="https://readerwrangler.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
